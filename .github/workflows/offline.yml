name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  console:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_repository.py
      - run: python -m unittest labconsole.tests.test_console labconsole.tests.test_replay labconsole.tests.test_live -v
  reference-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - run: python -m unittest discover -s sta/tools/tests -v
      - run: python -m unittest discover -s sta/app/tests -v
      - run: make -C sta/app
