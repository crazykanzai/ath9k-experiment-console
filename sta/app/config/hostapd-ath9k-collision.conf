# Four-STA collision-model experiment profile for the current ath9k AP.
# Keep the management Ethernet interface untouched.
interface=wlp2s0
driver=nl80211
ssid=ath9k_test
hw_mode=g
channel=6
ieee80211n=0
wmm_enabled=1
auth_algs=1

# Make 24 Mbps the sole basic rate so STA unicast can be locked to one
# legacy OFDM rate without dropping an AP-required lower basic rate.
basic_rates=240

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
